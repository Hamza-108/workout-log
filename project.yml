name: WorkoutLog
options:
  bundleIdPrefix: com.hamzabehrem
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
targets:
  WorkoutLog:
    type: application
    platform: iOS
    sources:
      - path: WorkoutLog
        excludes: [Info.plist]
      - path: Shared
    dependencies:
      - target: WorkoutLogActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzabehrem.workoutlog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Workout Log
        INFOPLIST_FILE: WorkoutLog/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.8.0"
        CURRENT_PROJECT_VERSION: "9"
  WorkoutLogActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: WorkoutLogActivity
        excludes: [Info.plist]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzabehrem.workoutlog.activity
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: WorkoutLogActivity/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Workout Log Status
        MARKETING_VERSION: "0.8.0"
        CURRENT_PROJECT_VERSION: "9"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  WorkoutLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WorkoutLogTests]
    dependencies:
      - target: WorkoutLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  WorkoutLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WorkoutLogUITests]
    dependencies:
      - target: WorkoutLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WorkoutLog:
    build:
      targets:
        WorkoutLog: all
    test:
      targets: [WorkoutLogTests, WorkoutLogUITests]
